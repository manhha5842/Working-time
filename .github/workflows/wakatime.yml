name: Backup WakaTime and update dashboard

on:
  schedule:
    # 19:10 UTC = 02:10 ICT (UTC+7)
    - cron: "10 19 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: wakatime-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch WakaTime data
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: python scripts/fetch_wakatime.py

      - name: Generate README dashboard
        run: python scripts/generate_readme.py

      - name: Commit updated archive
        run: |
          git config user.name "wakatime-bot"
          git config user.email "wakatime-bot@users.noreply.github.com"
          git add data README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update WakaTime history"
          git push
