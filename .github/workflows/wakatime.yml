name: Backup WakaTime and update dashboard

on:
  schedule:
    # 19:10 UTC = 02:10 ICT (UTC+7)
    - cron: "10 19 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "site/**"
      - ".github/workflows/wakatime.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: wakatime-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch WakaTime data
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: python scripts/fetch_wakatime.py

      - name: Generate README dashboard
        run: python scripts/generate_readme.py

      - name: Generate static site data
        run: python scripts/generate_site_data.py

      - name: Commit updated archive
        run: |
          git config user.name "wakatime-bot"
          git config user.email "wakatime-bot@users.noreply.github.com"
          git add data README.md site/dashboard.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update WakaTime history"
            git push
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    needs: backup
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
