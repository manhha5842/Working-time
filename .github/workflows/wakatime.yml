name: Sync WakaTime Archive

on:
  schedule:
    - cron: "10 19 * * *" # 02:10 ICT
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/fetch_wakatime.py"
      - "scripts/generate_site_data.py"
      - "scripts/generate_readme.py"
      - "scripts/smoke_test.py"
      - ".github/workflows/wakatime.yml"

permissions:
  contents: write

concurrency:
  group: wakatime-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch WakaTime archive
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: python scripts/fetch_wakatime.py
      - name: Generate README and site dataset
        run: |
          python scripts/generate_readme.py
          python scripts/generate_site_data.py
      - name: Validate dashboard
        run: |
          node --check site/app.js
          python scripts/smoke_test.py
      - name: Commit archive update
        run: |
          git config user.name "wakatime-bot"
          git config user.email "wakatime-bot@users.noreply.github.com"
          git add data timeline README.md site/dashboard.json
          if git diff --cached --quiet; then
            echo "No archive changes"
          else
            git commit -m "chore: sync WakaTime archive"
            git pull --rebase origin main
            git push origin main
          fi
